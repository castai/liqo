metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: internalfabrics.networking.liqo.io
spec:
  group: networking.liqo.io
  names:
    categories:
    - liqo
    kind: InternalFabric
    listKind: InternalFabricList
    plural: internalfabrics
    shortNames:
    - if
    - ifabric
    singular: internalfabric
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gatewayIP
      name: Gateway IP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          InternalFabric contains the network internalfabric settings.
          Every internalfabric resource targets a single gateway
          and respresents a connection between the local cluster and a remote one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InternalFabricSpec defines the desired state of InternalFabric.
            properties:
              gatewayIP:
                description: |-
                  GatewayIP is the IP of the gateway pod.

                  Deprecated: use Replicas instead.
                format: ipv4
                type: string
              interface:
                description: |-
                  Interface contains the information about network interfaces.

                  Deprecated: use Replicas instead.
                properties:
                  gateway:
                    description: Gateway contains the information about the gateway
                      interface.
                    properties:
                      ip:
                        description: IP is the IP of the interface added to the gateway.
                        format: ipv4
                        type: string
                    required:
                    - ip
                    type: object
                  node:
                    description: |-
                      Node contains the information about the node interface.
                      The node interface is created on every node to connect them to the gateway related with the internalfabric.
                    properties:
                      name:
                        description: Name is the name of the interface added to the
                          nodes.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - gateway
                - node
                type: object
              mtu:
                description: MTU is the MTU of the internal fabric.
                type: integer
              remoteCIDRs:
                description: RemoteCIDRs is the list of remote CIDRs to be routed
                  through the gateway.
                items:
                  description: CIDR defines a syntax validated CIDR.
                  format: cidr
                  type: string
                type: array
              replicas:
                description: Replicas contains the information about the gateway replicas.
                items:
                  description: InternalFabricReplica contains the information about
                    a gateway replica.
                  properties:
                    gatewayIP:
                      description: GatewayIP is the IP of the gateway pod.
                      format: ipv4
                      type: string
                    interface:
                      description: Interface contains the information about network
