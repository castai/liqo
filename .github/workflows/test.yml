name: Unit Testing
on:
  push:
    branches:
      - "master"
  pull_request:
  issue_comment:
    types:
      - created

jobs:
  test:
    name: Launch Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/test'))
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Launch Test (Docker Container)
        run: make unit
